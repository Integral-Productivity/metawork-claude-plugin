name: Validate plugin manifest

# Gate every PR on `claude plugin validate` so a plugin that is valid JSON but
# invalid against the Claude Code plugin schema cannot reach `main`. Delegates
# to the org-wide reusable workflow in devops-excellence (ADR-038) so the gate
# stays DRY across every *-claude-plugin repo.
#
# `claude plugin validate` is a local, auth-free schema check (no API key, no
# login), so it needs no secrets.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: Integral-Productivity/reusable-workflows/.github/workflows/validate-plugin-manifest.yml@v1

  # CQ-15 from metawork-ontology: the enums in the plugin's YAML schema must
  # equal the SKOS notations in the ontology. Run the ontology's own test
  # against this repo's schema so drift fails here, at the source of change.
  # metawork-ontology is public, so the checkout needs no token.
  schema-sync:
    name: Schema in sync with ontology (CQ-15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Integral-Productivity/metawork-ontology
          path: metawork-ontology

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ontology requirements
        run: pip install -r metawork-ontology/requirements.txt

      - name: Use plugin schema as ontology fixture
        run: cp lib/schema/metawork-group.schema.yaml metawork-ontology/fixtures/metawork-group.schema.yaml

      - name: Run CQ-15
        working-directory: metawork-ontology
        run: pytest -q tests/test_competency_questions.py::test_cq15_plugin_schema_in_sync

  # Issue #39 / ADR-0008: the helper metawork-set-up and metawork-diagnose call
  # (lib/ontology/validate-group.sh) must pass a conforming markdown group and
  # fail a violating one. Run against the vendored snapshot the plugin ships
  # AND against metawork-ontology@main, so an upstream shape change that would
  # break the skills fails here before the next sync PR lands it.
  ontology-validate:
    name: Group validation helper (${{ matrix.ontology }} ontology)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ontology: [vendored, upstream-main]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        if: matrix.ontology == 'upstream-main'
        with:
          repository: Integral-Productivity/metawork-ontology
          path: metawork-ontology

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ontology requirements
        run: pip install -r lib/ontology/vendor/requirements.txt

      - name: Run helper acceptance tests
        env:
          METAWORK_ONTOLOGY_DIR: ${{ matrix.ontology == 'upstream-main' && format('{0}/metawork-ontology', github.workspace) || '' }}
        run: python -m pytest -q tests/ontology

name: sync-methodology

# Pulls the latest narrative methodology from Integral-Productivity/metawork-methodology
# into references/ and opens a PR if anything changed.
#
# Triggered:
#   - daily (low-cost heartbeat sync)
#   - manually via workflow_dispatch
#   - on a push to metawork-methodology@main via a repository_dispatch
#     event (configure the source repo to fire it if you want near-realtime sync)
#
# See docs/adr/0003-methodology-in-separate-repo.md for the rationale.

on:
  schedule:
    - cron: '0 12 * * *'           # 12:00 UTC daily
  workflow_dispatch: {}
  repository_dispatch:
    types: [metawork-methodology-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-methodology
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Checkout methodology repo
        uses: actions/checkout@v4
        with:
          repository: Integral-Productivity/metawork-methodology
          path: .methodology-src
          ref: main

      - name: Capture upstream SHA
        id: upstream
        run: |
          echo "sha=$(git -C .methodology-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git -C .methodology-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync methodology into references/
        run: |
          set -euo pipefail
          mkdir -p references/pillars
          # Only copy the canonical narrative + pillars; leave other doc tree alone.
          cp .methodology-src/docs/methodology.md references/methodology.md
          cp -r .methodology-src/docs/pillars/. references/pillars/
          # Stamp the snapshot so readers know what it corresponds to.
          cat > references/SNAPSHOT.md <<EOF
          # references/ snapshot

          This directory is generated by .github/workflows/sync-methodology.yml.
          Do not hand-edit \`methodology.md\` or files under \`pillars/\` here —
          edits will be overwritten on next sync.

          Source: \`Integral-Productivity/metawork-methodology@${{ steps.upstream.outputs.short_sha }}\`
          (full SHA: \`${{ steps.upstream.outputs.sha }}\`)
          EOF

      - name: Clean up source clone
        run: rm -rf .methodology-src

      # We open the PR with a shell step rather than peter-evans/create-pull-request
      # because the Integral-Productivity org's GitHub Actions allowlist restricts
      # third-party actions to a curated set (see the org's Actions settings).
      # peter-evans/create-pull-request isn't on that list, so using it triggered
      # `startup_failure` on the receiver before any step ran.
      #
      # If we later need PRs opened here to fire downstream CI (the built-in
      # GITHUB_TOKEN doesn't trigger workflows on PRs it creates), mint a token
      # via actions/create-github-app-token@v1 — that one IS on the allowlist —
      # and pass it as GH_TOKEN below.
      - name: Open or update PR if references/ changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          FULL_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet --exit-code -- references/; then
            echo "No changes under references/; nothing to PR."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH=chore/sync-methodology
          git checkout -B "$BRANCH"
          git add references/
          git commit -m "chore(references): sync methodology @ ${SHORT_SHA}"
          git push --force origin "$BRANCH"

          # Ensure the auto-PR's labels exist (idempotent — survives missing labels).
          gh label create chore             --color ededed --description "Maintenance"               --force >/dev/null
          gh label create references-sync   --color 0e8a16 --description "Automated references/ sync" --force >/dev/null

          # Create the PR if one doesn't already exist for this branch; otherwise
          # the force-push above already updated it in place.
          if ! gh pr view "$BRANCH" --json number --jq '.number' >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(references): sync methodology @ ${SHORT_SHA}" \
              --body "Automated sync of \`Integral-Productivity/metawork-methodology@main\` into \`references/\`.

          Source SHA: \`${FULL_SHA}\`

          See ADR-0003 (\`docs/adr/0003-methodology-in-separate-repo.md\`) for why this is the sync mechanism." \
              --label chore \
              --label references-sync
          fi
